site_name: Delphinai Corporation
site_url: https://delphinai.ca

nav:
  - Welcome to Delphin AI:
      - Overview: index.md
      - Abbreviations: includes/abbreviations.md

extra_css:
  - stylesheets/extra.css

theme:
  name: "material"
  custom_dir: docs/overrides
  favicon: img/favicon.ico
  logo: img/DelphinaiLogo.svg
  icon:
    admonition:
    server: material/server
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

copyright: Copyright &copy; 2025 Delphinai Corporation

markdown_extensions:
  - admonition # Supported types: https://squidfunk.github.io/mkdocs-material/reference/admonitions/#supported-types
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.extra
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - attr_list
  - smarty

plugins:
  - search
  - autorefs
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Delphinai

watch:
  - docs
